name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.8.0.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusic-v1.8.0-APK
          path: release-output/ShadowMusic-v1.8.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          name: "ShadowMusic v1.8.0 (Persistent Signing & Auto-Playlists)"
          body: |
            ### ⚡ ShadowMusic v1.8.0 — Major Milestone!
            - **Seamless App Updates (Persistent Keystore)**: Fixed the signature mismatch issue once and for all. All future builds are now signed with a permanent dedicated keystore (`keystore.p12`). You can now update the app by simply tapping "Update" without having to uninstall previous versions!
            - **Native Watch Playlists (.m3u)**: Sharing an album automatically creates and registers an `.m3u` playlist in `/sdcard/Music/Playlists/`. The full album appears neatly grouped in the "Плейлисты" (Playlists) section of Huawei Music!
            - **Dynamic Subnet & Anywhere Hotspot Sync**: Finds watch on any Wi-Fi or Phone Hotspot.
          files: release-output/ShadowMusic-v1.8.0.apk
