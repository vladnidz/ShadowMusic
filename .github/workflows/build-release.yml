name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.7.0.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusic-v1.7.0-APK
          path: release-output/ShadowMusic-v1.7.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: "ShadowMusic v1.7.0 (Background Service & Track Manager)"
          body: |
            ### ⚡ ShadowMusic v1.7.0 — Major Upgrade!
            - **Silent Background Processing**: Sharing from YouTube Music does not interrupt you or open a full-screen window. The download and watch push happen silently via a Foreground Service with a clean system notification progress bar.
            - **Track Manager UI in App**:
              - View all downloaded tracks with file sizes and dates.
              - Multi-selection: "Select All" / "Deselect".
              - Batch Upload: "⚡ Upload Selected (N)" to watch over Wi-Fi.
              - Batch Delete: "🗑 Delete Selected (N)" from device storage.
              - Single-tap quick action buttons for individual tracks.
            - **Native Huawei Music Integration**: Strictly writes to `/sdcard/Music/Imported Songs/` with instant MediaScanner refresh.
          files: release-output/ShadowMusic-v1.7.0.apk
