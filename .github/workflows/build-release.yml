name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.1.0.apk \;
          ls -lh release-output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "ShadowMusic v1.1.0 (Album & Playlists Support)"
          body: |
            ### ⚡ ShadowMusic v1.1.0 (Playlists & Albums Edition)
            - **Album & Playlist 1-Click Sharing**: Share full albums and playlists directly from YouTube Music ReVanced.
            - **Auto M3U Generation**: Generates `.m3u` playlist files automatically placed in `/sdcard/Music/Playlists/`.
            - **Imported Songs Directory**: Targets `/sdcard/Music/Imported Songs/` for native Huawei Music recognition.
            - **MediaScanner Broadcast**: Automatically refreshes the Huawei watch library so tracks show up instantly.
          files: release-output/ShadowMusic-v1.1.0.apk
