name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.7.1.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusic-v1.7.1-APK
          path: release-output/ShadowMusic-v1.7.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.1
          name: "ShadowMusic v1.7.1 (Full Album & Playlist Downloader)"
          body: |
            ### ⚡ ShadowMusic v1.7.1
            - **Full Album & Playlist Support**: Share full albums (`/playlist?list=OLAK5uy_...`) or playlists directly from YouTube Music.
            - **Batch Background Processing**: Iterates through all tracks in the album, showing live progress (`[1/12] Track Name (45%)`), and pushes them sequentially to Huawei Watch 3 Pro.
            - **Track Manager Synchronization**: Every downloaded track from the album appears in the local Track Manager in real-time.
          files: release-output/ShadowMusic-v1.7.1.apk
