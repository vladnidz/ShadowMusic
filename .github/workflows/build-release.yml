name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.6.1.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusic-v1.6.1-APK
          path: release-output/ShadowMusic-v1.6.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: "ShadowMusic v1.6.1 (Auto ADB Key Generation)"
          body: |
            ### ⚡ ShadowMusic v1.6.1
            - **Auto ADB KeyPair Generation**: Fixed `~/.android/adbkey ENOENT` error. App now automatically creates and manages its own secure ADB key pair in internal storage (`filesDir/adbkey`).
            - **Instant Wi-Fi Direct Push**: Direct push to `/sdcard/Music/Imported Songs/` with auto-scanner broadcast.
            - **Seamless Bluetooth Fallback**: When away from home Wi-Fi.
          files: release-output/ShadowMusic-v1.6.1.apk
