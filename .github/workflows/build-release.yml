name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.2.0.apk \;
          ls -lh release-output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "ShadowMusic v1.2.0 (Huawei Health Protocol Edition)"
          body: |
            ### ⚡ ShadowMusic v1.2.0 (Huawei Health Protocol Edition)
            - **Native Huawei TLV BLE Protocol**: Uses reverse-engineered `FileUpload (id: 0x28, fileType: 2, MUSIC)` from Gadgetbridge.
            - **Zero Standby Battery Drain**: Watches remain in Deep Sleep until a transfer packet is sent.
            - **No Watch Daemon Needed**: Files are transferred directly into Huawei's native music service.
          files: release-output/ShadowMusic-v1.2.0.apk
