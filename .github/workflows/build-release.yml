name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.5.2.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusic-v1.5.2-APK
          path: release-output/ShadowMusic-v1.5.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.2
          name: "ShadowMusic v1.5.2 (Unthrottled Download & Bluetooth Handler)"
          body: |
            ### ⚡ ShadowMusic v1.5.2
            - **Unthrottled High-Speed Download**: Implemented 1MB Range chunk downloading. Completely bypasses YouTube's 128 kbps rate-limiting. Download takes seconds instead of minutes.
            - **Real Bluetooth Intent Resolution**: Uses `PackageManager.queryIntentActivities` to launch Xiaomi HyperOS Bluetooth transfer activity reliably.
            - **Honest UI State**: Direct user guidance during Bluetooth dispatch.
          files: release-output/ShadowMusic-v1.5.2.apk
