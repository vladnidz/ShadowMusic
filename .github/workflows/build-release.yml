name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.6.3.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusic-v1.6.3-APK
          path: release-output/ShadowMusic-v1.6.3.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.3
          name: "ShadowMusic v1.6.3 (Single Folder & Storage Optimized)"
          body: |
            ### ⚡ ShadowMusic v1.6.3
            - **Storage Optimized (No 2x Duplication)**: Pushes strictly to `/sdcard/Music/Imported Songs/`. Zero wasted watch storage.
            - **Native Huawei Music Integration**: Songs appear directly in the 'Imported Songs' section of the watch music player.
            - **Strict .mp3 Extension & Clean MediaScanner**: Direct indexing.
          files: release-output/ShadowMusic-v1.6.3.apk
