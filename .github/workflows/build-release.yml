name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.6.4.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusic-v1.6.4-APK
          path: release-output/ShadowMusic-v1.6.4.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.4
          name: "ShadowMusic v1.6.4 (Physical Connection Detection)"
          body: |
            ### ⚡ ShadowMusic v1.6.4
            - **Honest Physical Bluetooth Link Detection**: Now checks real ACL/GATT connection state with `BluetoothDevice.isConnected()` and `BluetoothManager.getConnectionState()`. Does not falsely report "Ready" if paired device is away or turned off.
            - **Strict .mp3 Extension & Single Folder**: Pushes strictly to `/sdcard/Music/Imported Songs/`.
            - **Instant Wi-Fi Direct Push**: Takes 1.5 seconds when both devices are on the same Wi-Fi.
          files: release-output/ShadowMusic-v1.6.4.apk
