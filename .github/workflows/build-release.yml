name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.3.0.apk \;
          ls -lh release-output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "ShadowMusic v1.3.0 (Bluetooth OPP Transfer)"
          body: |
            ### ⚡ ShadowMusic v1.3.0 (Bluetooth OPP Transfer)
            - **Honest Hardware Status**: Probes Bluetooth adapter and Wi-Fi socket in real-time.
            - **No Mock / Fake Labels**: Displays accurate red/yellow/green connection status based on actual radio state.
            - **Dual Channel**: Real-time switching between Wi-Fi and Bluetooth.
          files: release-output/ShadowMusic-v1.3.0.apk
