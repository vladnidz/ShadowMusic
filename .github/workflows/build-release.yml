name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.5.1.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusic-v1.5.1-APK
          path: release-output/ShadowMusic-v1.5.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.1
          name: "ShadowMusic v1.5.1 (NewPipeExtractor v0.26.5 Fix)"
          body: |
            ### ⚡ ShadowMusic v1.5.1
            - **Upgraded NewPipeExtractor to v0.26.5**: Fixes YouTube's `The page needs to be reloaded` (TVHTML5 removal & SABR bypass).
            - **Full POST Data forwarding**: Downloader properly forwards POST requestBody.
            - **Runtime Permissions on Start**: Requests Bluetooth and Storage permissions immediately on app launch.
            - **Bluetooth OPP Direct Transfer**: Direct send to paired Huawei Watch 3 Pro.
          files: release-output/ShadowMusic-v1.5.1.apk
