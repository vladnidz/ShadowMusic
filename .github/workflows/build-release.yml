name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.6.0.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusic-v1.6.0-APK
          path: release-output/ShadowMusic-v1.6.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: "ShadowMusic v1.6.0 (Instant Wi-Fi Push & BT Fallback)"
          body: |
            ### ⚡ ShadowMusic v1.6.0
            - **Instant Wi-Fi Direct Push**: When on the same Wi-Fi as Huawei Watch 3 Pro, pushes file directly into `/sdcard/Music/Imported Songs/` in 1.5 seconds with ZERO button presses needed on the watch.
            - **Auto Media Scanner Broadcast**: Song appears in native Huawei Music player immediately with metadata & album art.
            - **Unthrottled 1MB Range Download**: Takes seconds to extract and download stream.
            - **Seamless Bluetooth Fallback**: When outside or away from home Wi-Fi, triggers Bluetooth share sheet.
          files: release-output/ShadowMusic-v1.6.0.apk
