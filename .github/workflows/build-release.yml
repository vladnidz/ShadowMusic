name: Build ShadowMusic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-output/ShadowMusic-v1.6.2.apk \;
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowMusic-v1.6.2-APK
          path: release-output/ShadowMusic-v1.6.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.2
          name: "ShadowMusic v1.6.2 (Native MP3 & MediaScanner Fix)"
          body: |
            ### ⚡ ShadowMusic v1.6.2
            - **Strict .mp3 Extension**: Huawei Music on watch filters tracks by `.mp3`. Files are now saved as `.mp3` so they appear immediately in the player.
            - **Dual-Folder Distribution**: Pushes to both `/sdcard/Music/Imported Songs/` and `/sdcard/Music/`.
            - **Unescaped MediaScanner Broadcast**: Removed `%20` encoding bug that caused MediaScanner to miss files with spaces in names.
            - **Multi-Subnet Wi-Fi Scan**: Scans both 192.168.1.x and 192.168.0.x subnets.
          files: release-output/ShadowMusic-v1.6.2.apk
